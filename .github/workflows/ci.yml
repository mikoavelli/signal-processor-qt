name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux (Qt 6, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.*"
          host: linux
          target: desktop
          arch: linux_gcc_64
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.12 (MSVC 2022)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --no-cache-dir "git+https://github.com/miurahr/aqtinstall.git@master"
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir D:\a\qt
      - name: Expose Qt
        shell: pwsh
        run: |
          "D:\a\qt\6.12.0\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=D:\a\qt\6.12.0\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build-win --config Release --parallel
      - run: ctest --test-dir build-win -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - run: windeployqt --release --no-translations --dir package build-win\Release\SignalProcessor.exe
      - run: cp settings.json package/settings.json
      - uses: actions/upload-artifact@v4
        with:
          name: SignalProcessor-win64
          path: package/
